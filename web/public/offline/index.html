<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>离线学习 · DeepTutor</title>
    <link rel="stylesheet" href="/offline/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <a href="/today">← 返回工作台</a>
          <h1>离线学习</h1>
          <p>已经保存的资料，随时可以继续。答案提交后才会产生评阅记录。</p>
        </div>
        <span id="network" role="status"></span>
      </header>
      <section class="toolbar">
        <label>工作区<select id="workspace"></select></label
        ><button id="sync">联网提交待评阅答案</button
        ><button id="clear" class="secondary">清除此工作区的离线内容</button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="items"></div>
      <p class="footnote">
        离线内容保存在这个浏览器，包括题目、答案和选中的
        PDF。请仅在你信任的个人设备保存；清除浏览器数据会移除未提交答案。离线作答的独立性无法核实。
      </p>
    </main>
    <script type="module" src="/offline/app.js"></script>
  </body>
</html>
