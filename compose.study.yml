services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.study
      target: api
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - study-runtime:/runtime
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.study
      target: web
    environment:
      DEEPTUTOR_API_BASE_URL: http://api:8001
    ports:
      - "127.0.0.1:3782:3782"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  study-runtime:
