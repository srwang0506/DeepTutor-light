name: Hosted workspace
on:
  workflow_dispatch:
  push:
    branches: [codex/study-workbench]
    paths:
      - 'Dockerfile.study*'
      - 'deployment/hosted/**'
      - 'compose.hosted.yml'
      - '.github/workflows/hosted-workspace.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the hosted workspace
        run: |
          docker build -f Dockerfile.study --target hosted -t deeptutor-hosted-check \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker image inspect --format 'Uncompressed image size: {{.Size}} bytes' deeptutor-hosted-check
      - name: Verify sign-in, protected application routes and persistence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export TEST_WORKSPACE_PASSWORD
          TEST_WORKSPACE_PASSWORD="$(openssl rand -hex 20)"
          hash="$(printf '%s' "$TEST_WORKSPACE_PASSWORD" | docker run --rm -i deeptutor-hosted-check python -c 'import bcrypt,sys; print(bcrypt.hashpw(sys.stdin.buffer.read(), bcrypt.gensalt()).decode())')"
          start_workspace() {
            docker run -d --name hosted-check "$@" --memory=512m --memory-swap=512m --cpus=1 -e AUTH_PASSWORD_HASH="$hash" \
              -e DEEPTUTOR_PUBLIC_ORIGIN=https://workspace.example.test \
              --mount type=volume,src=hosted-check-data,dst=/runtime,volume-nocopy \
              -p 127.0.0.1:18080:8080 deeptutor-hosted-check
          }
          start_workspace --user 0
          python deployment/hosted/smoke.py
          docker exec hosted-check awk '/^Uid:/ {exit ($2 != 1000 || $3 != 1000)}' /proc/1/status
          test "$(docker exec hosted-check stat -c '%u:%g:%a' /runtime)" = 1000:1000:700
          docker exec hosted-check cat /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events
          docker stop hosted-check
          docker rm hosted-check
          start_workspace
          python deployment/hosted/smoke.py --resume
      - name: Report startup diagnostics on failure
        if: failure()
        run: docker logs --tail 100 hosted-check 2>&1 || true
      - name: Publish the verified Linux image
        if: github.ref == 'refs/heads/codex/study-workbench'
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/hosted:sha-$GITHUB_SHA"
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag deeptutor-hosted-check "$image"
          docker push "$image"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          docker pull "$digest"
          printf 'Verified Linux/amd64 workspace image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
