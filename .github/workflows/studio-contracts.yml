name: Personal Studio contracts

on:
  workflow_dispatch:
  push:
    branches: [codex/study-workbench]
  pull_request:
    paths:
      - 'deeptutor/studio/**'
      - 'deeptutor/services/session/**'
      - 'deeptutor/learning/quiz.py'
      - 'deeptutor/learning/quiz_views.py'
      - 'deeptutor/learning/question_families.py'
      - 'deeptutor/api/**'
      - 'deeptutor/runtime/**'
      - 'web/**'
      - 'tests/studio/**'
      - '.github/workflows/studio-contracts.yml'

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEEPTUTOR_STUDY_RUNTIME: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Use an isolated runtime
        run: echo "DEEPTUTOR_HOME=$RUNNER_TEMP/studio-contract-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/study.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements/study.lock.txt
          npm --prefix web ci --legacy-peer-deps
      - name: Bootstrap default application settings
        run: python -c "from deeptutor.services.setup import init_user_directories; init_user_directories()"
      - name: Audit production dependencies
        run: npm --prefix web audit --omit=dev --audit-level=high
      - name: Verify domain regressions and legacy session migration
        run: >-
          python -m pytest -q tests/studio tests/learning/test_study_quiz.py
          tests/learning/test_study_operations.py
          tests/services/session/test_sqlite_store.py
          tests/runtime/test_launcher.py tests/runtime/test_launcher_lifecycle.py
          --junitxml=studio-domain-results.xml
      - name: Verify client contracts and editing state
        working-directory: web
        run: |
          npm run check:fast
      - name: Verify offline reading and replay in a real browser
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          node tests/offline-browser.mjs
      - name: Preserve results for this commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-contracts-${{ github.sha }}
          path: studio-domain-results.xml
          if-no-files-found: ignore
