[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/deeptutor-supervisord.pid
childlogdir=/tmp

[program:api]
command=python -m uvicorn deployment.hosted.access:create_app --factory --host 127.0.0.1 --port 8001 --no-access-log
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=/usr/local/bin/node /opt/deeptutor-web/server.js
directory=/opt/deeptutor-web
environment=HOSTNAME="127.0.0.1",PORT="3782"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ingress]
command=nginx -c /tmp/deeptutor-nginx.conf -g "daemon off;"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
